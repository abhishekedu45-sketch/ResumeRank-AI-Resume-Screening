<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Screening System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #080b18, #24104b, #421b70);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 750px;
            padding: 50px 30px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            color: #d5c9f5;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 14px 35px;
            background: #8b5cf6;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        a:hover {
            background: #a78bfa;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🤖 AI Resume Screening</h1>

        <p>
            Welcome to our AI-powered Resume Screening and Ranking System.
            Our platform helps recruiters analyze resumes, identify relevant
            skills and rank candidates based on job requirements.
        </p>

        <a href="{{ url_for('admin_login') }}">
            Admin Login
        </a>

    </div>

</body>
</html>
